<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DEEPZ Admin Login</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#07152b;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.login-box{
  width:100%;
  max-width:400px;
  background:#ffffff;
  padding:30px;
  border-radius:18px;
  box-shadow:0 10px 35px rgba(0,0,0,.35);
}

.logo{
  text-align:center;
  font-size:28px;
  font-weight:bold;
  color:#07152b;
  margin-bottom:8px;
}

.subtitle{
  text-align:center;
  color:#666;
  margin-bottom:25px;
}

label{
  display:block;
  margin-bottom:7px;
  font-weight:bold;
  color:#222;
}

input{
  width:100%;
  padding:14px;
  border:1px solid #ccc;
  border-radius:10px;
  margin-bottom:18px;
  font-size:16px;
}

button{
  width:100%;
  padding:14px;
  border:0;
  border-radius:10px;
  background:#07152b;
  color:white;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
}

#message{
  margin-top:15px;
  text-align:center;
  font-size:14px;
}
</style>
</head>

<body>

<div class="login-box">

  <div class="logo">DEEPZ Admin</div>

  <div class="subtitle">
    Secure Admin Login
  </div>

  <label>Email</label>
  <input
    type="email"
    id="email"
    placeholder="Enter admin email"
  >

  <label>Password</label>
  <input
    type="password"
    id="password"
    placeholder="Enter password"
  >

  <button id="loginButton" onclick="login()">
    Login
  </button>

  <div id="message"></div>

</div>

<script>

const SUPABASE_URL =
"https://sbnyvlpsbxfyphmtxpor.supabase.co";

const SUPABASE_KEY =
"sb_publishable_FYHEtuDDiFFDejg7vKunqw_JhL17yTR";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

async function login(){

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value.trim();

  const message =
    document.getElementById("message");

  const button =
    document.getElementById("loginButton");

  if(!email || !password){

    message.style.color = "red";
    message.textContent =
      "Please enter email and password.";

    return;
  }

  button.disabled = true;
  button.textContent = "Logging in...";

  const { data, error } =
    await supabaseClient.auth.signInWithPassword({
      email: email,
      password: password
    });

  if(error){

    message.style.color = "red";
    message.textContent = error.message;

    button.disabled = false;
    button.textContent = "Login";

    return;
  }

  message.style.color = "green";
  message.textContent = "Login successful...";

  setTimeout(function(){

    window.location.href =
      "admin-dashboard.html";

  },1000);
}

</script>

</body>
</html>
