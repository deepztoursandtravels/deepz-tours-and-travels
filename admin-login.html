<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DEEPZ Admin Login</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #07152b;
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 620px;
      background: #082d50;
      border-radius: 28px;
      padding: 70px 58px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    }

    h1 {
      margin: 0;
      font-size: 62px;
      font-weight: 700;
    }

    .subtitle {
      margin: 20px 0 65px;
      font-size: 30px;
      color: #bfc5ce;
    }

    input {
      width: 100%;
      padding: 25px;
      margin-bottom: 28px;
      border-radius: 15px;
      border: 2px solid #68727d;
      background: #071b31;
      color: white;
      font-size: 25px;
      outline: none;
    }

    input::placeholder {
      color: #89919c;
    }

    button {
      width: 100%;
      padding: 25px;
      border: none;
      border-radius: 15px;
      background: #f0bf00;
      color: #111;
      font-size: 27px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    #message {
      margin-top: 25px;
      font-size: 20px;
      color: #ffb3b3;
      min-height: 25px;
    }

    @media (max-width: 600px) {
      .login-box {
        padding: 55px 30px;
      }

      h1 {
        font-size: 48px;
      }

      .subtitle {
        font-size: 25px;
        margin-bottom: 50px;
      }

      input {
        font-size: 20px;
        padding: 20px;
      }

      button {
        font-size: 23px;
        padding: 21px;
      }
    }
  </style>
</head>

<body>

  <div class="login-box">
    <h1>DEEPZ Admin</h1>

    <div class="subtitle">
      Secure Admin Login
    </div>

    <input
      type="email"
      id="email"
      placeholder="Admin Email"
      autocomplete="email"
    >

    <input
      type="password"
      id="password"
      placeholder="Password"
      autocomplete="current-password"
    >

    <button id="loginButton" onclick="login()">
      Login
    </button>

    <div id="message"></div>
  </div>

  <script>
    const SUPABASE_URL = "https://sbnyvlpsbxfyphmtxpor.supabase.co";

    const SUPABASE_KEY = "sb_publishable_FYHEtuDDiFFDejg7vKunqw_JhL17yTR";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    async function login() {

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const message = document.getElementById("message");
      const button = document.getElementById("loginButton");

      message.textContent = "";

      if (!email || !password) {
        message.textContent = "Please enter email and password.";
        return;
      }

      button.disabled = true;
      button.textContent = "Logging in...";

      try {

        const { data, error } =
          await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
          });

        if (error) {
          message.textContent = error.message;
          button.disabled = false;
          button.textContent = "Login";
          return;
        }

        if (data.session) {
          window.location.replace("https://deepztoursandtravels.com/admin-dashboard.html");
        }

      } catch (error) {

        message.textContent = "Login failed. Please try again.";
        button.disabled = false;
        button.textContent = "Login";

      }
    }
  </script>

</body>
  </html>
